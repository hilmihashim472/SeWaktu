<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/iconSW.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeWaktu - Waktu Solat Malaysia</title>
    <script>
      (function () {
        var theme = localStorage.getItem("sewaktu.theme");
        var isDark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
